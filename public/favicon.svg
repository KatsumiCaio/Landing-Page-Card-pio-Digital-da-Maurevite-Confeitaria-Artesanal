<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#C49A6C" />
      <stop offset="100%" stop-color="#B48250" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A2D33" />
      <stop offset="100%" stop-color="#181A1D" />
    </radialGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Circle Badge -->
  <circle cx="60" cy="60" r="56" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="60" cy="60" r="51" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Stand Mixer Artisanal Vector Icon -->
  <g fill="none" stroke="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleShadow)">
    <!-- Mixer Motor Head -->
    <path d="M38 42 C38 35, 45 31, 56 31 L82 31 C87 31, 91 35, 91 40 L91 47 C91 49, 89 51, 86 51 L48 51 C42 51, 38 47, 38 42 Z" stroke-width="2.6" />
    
    <!-- Speed Lever / Top Knob -->
    <path d="M86 36 L94 36 C95.5 36, 96 37, 96 39 C96 41, 95.5 42, 94 42 L86 42" stroke-width="2.2" />
    
    <!-- Vertical Stand Column / Body -->
    <path d="M42 51 L37 77 C37 81, 41 85, 46 85 L84 85 C88 85, 91 81, 91 77 L89 74" stroke-width="2.6" />
    
    <!-- Mixing Bowl -->
    <path d="M50 53 L83 53 C83 53, 83 71, 66.5 71 C50 71, 50 53, 50 53 Z" stroke-width="2.4" />
    
    <!-- Whisk Detail -->
    <ellipse cx="66.5" cy="62" rx="4.5" ry="7" stroke-width="1.8" />
    <path d="M66.5 52 L66.5 69" stroke-width="1.8" />
    
    <!-- Solid Base Plate -->
    <path d="M30 85 L96 85" stroke-width="3" />
    
    <!-- Decorative Stars / Sparkles -->
    <path d="M32 30 L34 26 L36 30 L40 32 L36 34 L34 38 L32 34 L28 32 Z" fill="url(#goldGrad)" stroke="none" opacity="0.85" />
    <path d="M92 68 L93.5 65 L95 68 L98 69.5 L95 71 L93.5 74 L92 71 L89 69.5 Z" fill="url(#goldGrad)" stroke="none" opacity="0.75" />
  </g>
</svg>
